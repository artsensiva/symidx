# The pilot's Fluent Bit pipeline, driven by sanitize_tool.py. Lua alone is its best configuration tried (experiment 4).
[SERVICE]
    Flush        0.2
    Log_Level    error
    Grace        1

[INPUT]
    Name              tail
    Tag               out
    Path              ${FILE}
    Read_from_Head    true
    Exit_On_Eof       true
    Refresh_Interval  1
    Inotify_Watcher   false
    Buffer_Chunk_Size 1M
    Buffer_Max_Size   64M
    Mem_Buf_Limit     64M

[FILTER]
    Name         lua
    Match        out
    Script       ${FB_DIR}/${FORMAT}.lua
    Call         f
    Type_Int_Key sev

[FILTER]
    Name  rewrite_tag
    Match out
    Rule  $_bad ^1$ rejected false

[OUTPUT]
    Name           file
    Match          out
    Path           ${OUT_DIR}
    File           ${OUT_FILE}
    Format         plain

[OUTPUT]
    Name     file
    Match    rejected
    Path     ${OUT_DIR}
    File     ${REJ_FILE}
    Format   template
    Template {log}
