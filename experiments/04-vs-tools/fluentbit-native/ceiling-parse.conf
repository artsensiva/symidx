[SERVICE]
    Flush        0.2
    Log_Level    error
    Grace        1
    Parsers_File ${FB_DIR}/parsers.conf

[INPUT]
    Name              tail
    Path              ${FILE}
    Read_from_Head    true
    Exit_On_Eof       true
    Refresh_Interval  1
    Inotify_Watcher   false
    Buffer_Chunk_Size 1M
    Buffer_Max_Size   1M
    Mem_Buf_Limit     64M
    Parser            ${FORMAT}

[OUTPUT]
    Name           stdout
    Match          *
    Format         json_lines
    json_date_key  false
