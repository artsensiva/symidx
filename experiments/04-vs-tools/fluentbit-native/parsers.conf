# Native regex parsers for experiment 2's three formats. The ranges and word lists are part of each format.
[PARSER]
    Name   hdfs
    Format regex
    Regex  ^(?<y>[0-9]{2})(?<mo>0[1-9]|1[0-2])(?<d>0[1-9]|[12][0-9]|3[01]) (?<h>[01][0-9]|2[0-3])(?<mi>[0-5][0-9])(?<se>[0-5][0-9]) (?<pid>[0-9]+) (?<level>TRACE|DEBUG|INFO|WARN|ERROR|FATAL) (?<component>[^ ]+?): (?<msg>.*)$

[PARSER]
    Name   ssh
    Format regex
    Regex  ^(?<mon>Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) (?<d> [1-9]|0[1-9]|[12][0-9]|3[01]) (?<h>[01][0-9]|2[0-3]):(?<mi>[0-5][0-9]):(?<se>[0-5][0-9]) (?<host>[^ ]+) (?<prog>[^ \[]+)\[(?<pid>[0-9]+)\]: (?<msg>.*)$

[PARSER]
    Name   apache
    Format regex
    Regex  ^\[(?:Mon|Tue|Wed|Thu|Fri|Sat|Sun) (?<mon>Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) (?<d>0[1-9]|[12][0-9]|3[01]) (?<h>[01][0-9]|2[0-3]):(?<mi>[0-5][0-9]):(?<se>[0-5][0-9]) (?<y>[0-9]{4})\] \[(?<l>emerg|alert|crit|error|warn|notice|info|debug)\] (?<msg>.*)$
