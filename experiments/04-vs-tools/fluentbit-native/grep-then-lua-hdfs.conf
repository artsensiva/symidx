[SERVICE]
    Flush        0.2
    Log_Level    error
    Grace        1

[INPUT]
    Name              tail
    Path              ${FILE}
    Read_from_Head    true
    Exit_On_Eof       true
    Refresh_Interval  1
    Inotify_Watcher   false
    Buffer_Chunk_Size 1M
    Buffer_Max_Size   1M
    Mem_Buf_Limit     64M

# Drop the noisy loggers' INFO lines natively, before Lua sees them. Lua then does everything else, including rejecting malformed lines.
[FILTER]
    Name    grep
    Match   *
    Exclude log ^[0-9]{6} [0-9]{6} [0-9]+ INFO dfs\.(DataNode\$PacketResponder|FSDataset):\x20

[FILTER]
    Name         lua
    Match        *
    Script       ${FB_LUA_DIR}/hdfs.lua
    Call         f
    Type_Int_Key sev

[OUTPUT]
    Name           stdout
    Match          *
    Format         json_lines
    json_date_key  false
