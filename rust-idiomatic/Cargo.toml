[package]
name = "symidx"
version = "0.1.0"
edition = "2021"
description = "symidx, idiomatic Rust: owned Strings and Vecs, serde + bincode (see CLAUDE.md)"

[dependencies]
bincode = "1.3"
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"

[profile.release]
codegen-units = 1
lto = true
