# Correctness and relative comparisons on shared runners: every implementation is built, must match the
# reference checksum on S and M, and bench/run.sh runs with few repetitions. Shared runners are noisy:
# compare numbers only within one run, never across runs or with local results (README, "Methodology", environments).
name: bench

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]   # pinned: a "-latest" label migration would change the numbers silently
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -yq hyperfine time clang
      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install hyperfine

      - name: Cache Goose toolchain download
        uses: actions/cache@v6
        with:
          path: toolchain/dl
          key: goose-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('goose/toolchain.sha256') }}
      - name: Cache corpus sources
        uses: actions/cache@v6
        with:
          path: corpus/src
          key: corpus-src-${{ hashFiles('corpus/make.sh') }}
      - name: Cache cargo builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust-idiomatic -> target
            rust-expert -> target
            experiments/02-logxform/rust-arena -> target
            experiments/02-logxform/rust-idiomatic -> target

      - name: Build Goose implementation (pinned release, sha256-checked)
        run: goose/fetch-toolchain.sh && goose/build.sh
      - name: Build Rust implementations
        run: |
          rustc -V
          cargo build --release --locked --manifest-path rust-idiomatic/Cargo.toml
          cargo build --release --locked --manifest-path rust-expert/Cargo.toml

      - name: Corpora S and M
        run: corpus/make.sh S M

      - name: Checksums
        run: bench/check-sums.sh S M

      - name: Benchmark, warm cache (few runs; relative comparisons only)
        run: OUT=bench/results/ci-warm RUNS=3 bench/run.sh S M
      - name: Benchmark, cold cache (drop_caches on Linux, purge on macOS; runners have passwordless sudo)
        run: OUT=bench/results/ci-cold COLD=1 RUNS=3 bench/run.sh M

      - name: Check the summaries are complete
        run: |
          # Every field filled, every checksum matching, 4 implementations per corpus.
          check() {
            awk -F, -v want="$2" 'NR > 1 { rows++; for (i = 1; i <= NF; i++) if ($i == "") { print "empty field " i ": " $0; bad = 1 }
                                         if ($NF != "yes") { print "checksum: " $0; bad = 1 } }
                       END { if (rows != want) { print "rows: " rows " (want " want ")"; bad = 1 }; exit bad }' "$1"
          }
          check bench/results/ci-warm/summary.csv 8
          check bench/results/ci-cold/summary.csv 4

      # Experiment 2, logxform (experiments/02-logxform/): checksums on S and M, a short benchmark on M.
      - name: logxform corpus archives (Zenodo, sha256-checked)
        uses: actions/cache@v6
        with:
          path: |
            experiments/02-logxform/corpus/src/*.zip
            experiments/02-logxform/corpus/src/*.tar.gz
          key: logxform-corpus-${{ hashFiles('experiments/02-logxform/corpus/fetch.sh') }}
      - name: logxform build
        run: |
          experiments/02-logxform/corpus/fetch.sh
          experiments/02-logxform/goose/build.sh
          cargo build --release --locked --manifest-path experiments/02-logxform/rust-arena/Cargo.toml
          cargo build --release --locked --manifest-path experiments/02-logxform/rust-idiomatic/Cargo.toml
      - name: logxform checksums (ref.py rerun on S; everyone against the record on S and M)
        run: |
          REF=1 experiments/02-logxform/check-sums.sh S
          experiments/02-logxform/check-sums.sh M
      - name: logxform benchmark, warm cache, M (few runs; relative comparisons only)
        run: OUT=experiments/02-logxform/results/ci-warm RUNS=3 experiments/02-logxform/run.sh M
      - name: logxform summary complete
        run: |
          awk -F, 'NR > 1 { rows++; for (i = 1; i <= NF; i++) if ($i == "") { print "empty field " i ": " $0; bad = 1 }
                           if ($NF != "yes") { print "checksum: " $0; bad = 1 } }
                   END { if (rows != 3) { print "rows: " rows " (want 3)"; bad = 1 }; exit bad }' \
            experiments/02-logxform/results/ci-warm/summary.csv

      - name: Machine report
        if: always()
        run: bench/check-machine.sh || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-warm-${{ matrix.os }}
          path: |
            bench/results/ci-warm/summary.csv
            bench/results/ci-warm/env.txt
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-cold-${{ matrix.os }}
          path: |
            bench/results/ci-cold/summary.csv
            bench/results/ci-cold/env.txt
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: logxform-warm-${{ matrix.os }}
          path: |
            experiments/02-logxform/results/ci-warm/summary.csv
            experiments/02-logxform/results/ci-warm/env.txt
          if-no-files-found: warn
